<!DOCTYPE html>
<html>
<head>
    <title>NBA Database</title>
</head>
<body>
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
      <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .button {
            background-color: #007bff;
            color: white;
            padding: 10px 10px;
            font-family: 'Times New Roman', Times, serif;
            border-radius: 8px;
            font-size: 16px
        }
        .button:hover {
            background-color: #0056b3;
        }
        .textbox {
            padding: 10px;
            border: 2px solid #007bff;
            border-radius: 8px;
            width: 250px;       /* sets the width */
            font-size: 16px;    /* text size */
            font-family: 'Times New Roman', Times, serif;
        }
    </style>
    <h1>🏀 NBA Database</h1>
    <p>Stats are as of the 2023-24 NBA season</p>
    <br>
    <br>
    <form action="/career" method="POST">
        <input type="text" name="player_name" class="textbox" placeholder="Enter player name" required>
        <button type="submit" class="button">Career Totals</button>
    </form>
    <br>
    <br>
    <form action="/season" method="POST">
        <input type="text" name="player_name" class="textbox" placeholder="Enter player name" required>
        <button type="submit" class="button">Seasonal Averages</button>
    </form>

    <br>
    <br>

    <form action="/efficiency" method="POST">
        <input type="text" name="player_name" class="textbox" placeholder="Enter player name" required>
        <button type="submit" class="button">Efficiency</button>
    </form>

    <br>
    <br>
    <form action="/compare_players" method="POST">
        <input type="text" name="player1" class="textbox" placeholder="Enter first player" required>
        <input type="text" name="player2" class="textbox" placeholder="Enter second player" required>
        <button type="submit" class="button">Compare Players</button>
    </form>

</body>
</html>
